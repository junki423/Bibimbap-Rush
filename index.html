#mainScreen .main-card::after {

/* =========================
태극기
========================= */
:root {
--blue: #0047A0;
--red: #CD313A;
--black: #000000;
--white: #FFFFFF;
--trigrams-location-width: calc(cos(atan2(2, 3)) * (11 / 18));
--trigrams-location-height: calc(sin(atan2(2, 3)) * (11 / 12));
--brick-size: calc(1 / 6);
}
#mainScreen .taegeuk-background {
position: absolute;
inset: 0;
z-index: 0;
overflow: hidden;
pointer-events: none;
display: flex;
justify-content: center;
align-items: center;
}
#mainScreen .taegeuk-background .wrap {
position: relative;
width: max(100vw, 150vh);
aspect-ratio: 3 / 2;
height: auto;
overflow: hidden;
flex-shrink: 0;
}
#mainScreen .taegeuk-background .taegeukgi {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-color: var(--white);
display: flex;
align-items: center;
justify-content: center;
}
#mainScreen .taegeuk-background .taegeuk {
position: absolute;
width: calc((1 / 3) * 100%);
height: 50%;
background: linear-gradient(var(--red) 50%, var(--blue) 0);
border-radius: 50%;
transform: rotate(calc(atan2(2, 3)));
}
#mainScreen .taegeuk-background .taegeuk::before {
position: absolute;
content: "";
width: 50%;
height: 50%;
border-radius: 50%;
background-color: var(--red);
margin: 25% 0;
}
#mainScreen .taegeuk-background .taegeuk::after {
position: absolute;
content: "";
width: 50%;
height: 50%;
border-radius: 50%;
background-color: var(--blue);
margin: 25% 50%;
}
#mainScreen .taegeuk-background .trigrams {
position: absolute;
width: calc((var(--trigrams-location-width) + var(--brick-size)) * 100%);
height: calc((var(--trigrams-location-height) + var(--brick-size)) * 100%);
display: grid;
grid-template-rows: repeat(2, 1fr);
gap: calc(((var(--trigrams-location-width) - var(--brick-size)) / (var(--trigrams-location-width) + var(--brick-size))) * 100%);
}
#mainScreen .taegeuk-background .top,
#mainScreen .taegeuk-background .bottom {
display: flex;
justify-content: space-between;
}
#mainScreen .taegeuk-background .sky,
#mainScreen .taegeuk-background .water,
#mainScreen .taegeuk-background .fire,
#mainScreen .taegeuk-background .earth {
width: calc((var(--brick-size) / (var(--trigrams-location-width) + var(--brick-size))) * 100%);
display: grid;
column-gap: calc((1 / 12) * 100%);
row-gap: calc((1 / 8) * 100%);
grid-template-rows: repeat(3, 1fr);
grid-template-columns: repeat(2, 1fr);
}
#mainScreen .taegeuk-background .brick {
background-color: var(--black);
}
#mainScreen .taegeuk-background .sky {
grid-template-columns: 1fr;
}
#mainScreen .taegeuk-background .water {
grid-template-columns: repeat(2, 1fr);
}
#mainScreen .taegeuk-background .water .brick:nth-child(3) {
grid-column: span 2;
}
#mainScreen .taegeuk-background .fire {
grid-template-columns: repeat(2, 1fr);
}
#mainScreen .taegeuk-background .fire .brick:first-child,
#mainScreen .taegeuk-background .fire .brick:last-child {
grid-column: span 2;
}
#mainScreen .taegeuk-background .sky,
#mainScreen .taegeuk-background .earth {
transform: rotate(atan2(3, -2));
}
#mainScreen .taegeuk-background .water,
#mainScreen .taegeuk-background .fire {
transform: rotate(atan2(3, 2));
}
#mainScreen .floating-bowl-wrap {
position: absolute;
width: 250px;
height: 250px;
background: transparent;
border: none;
box-shadow: none;
border-radius: 0;

function getMainBowlMaxX() {
  return Math.max(0, window.innerWidth - mainBowlSize);
}

function getMainBowlMaxY() {
  return Math.max(0, window.innerHeight - mainBowlSize);
}

function createFloatingBowls() {
  bowlImages.forEach((imageName) => {
    const bowlWrap = document.createElement("div");
    bowlWrap.classList.add("floating-bowl-wrap");
    const img = document.createElement("img");
    img.src = imageName;
    img.alt = "Bibimbap Bowl";
    bowlWrap.appendChild(img);
    mainScreen.appendChild(bowlWrap);
    mainBowlData.push({
      element: bowlWrap,
      x: Math.random() * getMainBowlMaxX(),
      y: Math.random() * getMainBowlMaxY(),
      speedX:
        (Math.random() * 1.5 + 0.8) * (Math.random() < 0.5 ? 1 : -1),
      speedY:
        (Math.random() * 1.5 + 0.8) * (Math.random() < 0.5 ? 1 : -1),
      rotate: Math.random() * 30 - 15,
      rotateSpeed: Math.random() * 0.5 - 0.25,
      floatAngle: Math.random() * Math.PI * 2,
      floatSpeed: Math.random() * 0.03 + 0.02,
      floatPower: Math.random() * 10 + 8,
    });
  });
}

function moveFloatingBowls() {
  mainBowlData.forEach((item) => {
    item.x += item.speedX;
    item.y += item.speedY;
    item.rotate += item.rotateSpeed;
    item.floatAngle += item.floatSpeed;
    const maxX = getMainBowlMaxX();
    const maxY = getMainBowlMaxY();
    if (item.x <= 0) {
      item.x = 0;
      item.speedX *= -1;
    }
    if (item.x >= maxX) {
      item.x = maxX;
      item.speedX *= -1;
    }
    if (item.y <= 0) {
      item.y = 0;
      item.speedY *= -1;
    }
    if (item.y >= maxY) {
      item.y = maxY;
      item.speedY *= -1;
    }
    const floatingMotion = Math.sin(item.floatAngle) * item.floatPower;
    item.element.style.left = item.x + "px";
    item.element.style.top = item.y + "px";
    item.element.style.transform =
      "translateY(" +
      floatingMotion +
      "px) rotate(" +
      item.rotate +
      "deg)";
  });
  requestAnimationFrame(moveFloatingBowls);
}

function keepFloatingBowlsInsideWindow() {
  const maxX = getMainBowlMaxX();
  const maxY = getMainBowlMaxY();
  mainBowlData.forEach((item) => {
    if (item.x > maxX) item.x = maxX;
    if (item.y > maxY) item.y = maxY;
  });
}

function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function quantityLabel(count, name) {
  if (count === 1) return name;
  return `${name} x${count}`;
}

function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function generateOrderData() {
  const rice = riceOptions[randomInt(0, 1)];
  const sauceEntries = mandatorySauces.map((sauce) => ({
    name: sauce,
    count: randomInt(1, 2),
  }));
  const optionalEntries = [];
  const targetTotal = randomInt(5, 9);
  let remaining = targetTotal;
  for (let i = 0; i < optionalIngredients.length; i++) {
    const item = optionalIngredients[i];
    const remainingItems = optionalIngredients.length - i - 1;
    const maxPossibleLater = remainingItems * 2;
    const minCount = Math.max(0, remaining - maxPossibleLater);
    const maxCount = Math.min(2, remaining);
    const count = randomInt(minCount, maxCount);
    if (count > 0) {
      optionalEntries.push({ name: item, count });
    }
    remaining -= count;
  }
  const shuffledOptionalEntries = shuffle(optionalEntries);
  const eggEntries = [];
  if (Math.random() < 0.8) {
    eggEntries.push({
      name: "fried egg",
      count: 1,
    });
  }
  const galbiEntries = [];
  if (Math.random() < 0.8) {
    galbiEntries.push({
      name: "galbi",
      count: 1,
    });
  }
  const finalOptionalEntries = [
    ...shuffledOptionalEntries,
    ...eggEntries,
    ...galbiEntries,
  ];
  const ingredientsArray = [
    rice,
    ...finalOptionalEntries.flatMap((item) =>
      Array(item.count).fill(item.name),
    ),
    ...sauceEntries.flatMap((item) => Array(item.count).fill(item.name)),
  ];
  return {
    rice,
    optionalEntries: finalOptionalEntries,
    sauceEntries,
    ingredientsArray,
  };
}

function buildEnglishOrder(order) {
  const normalOptionalParts = order.optionalEntries
    .filter((item) => item.name !== "galbi")
    .map((item) => quantityLabel(item.count, item.name));
  const sauceParts = order.sauceEntries.map((item) =>
    quantityLabel(item.count, item.name),
  );
  const galbiParts = order.optionalEntries
    .filter((item) => item.name === "galbi")
    .map((item) => quantityLabel(item.count, item.name));
  const parts = [
    order.rice,
    ...normalOptionalParts,
    ...sauceParts,
    ...galbiParts,
  ];
  if (parts.length === 1) {
    return `Can I get bibimbap with ${parts[0]}, please?`;
  }
  if (parts.length === 2) {
    return `Can I get bibimbap with ${parts[0]} and ${parts[1]}, please?`;
  }
  const last = parts[parts.length - 1];
  const rest = parts.slice(0, -1);
  return `Can I get bibimbap with ${rest.join(", ")}, and ${last}, please?`;
}

function koreanQuantityLabel(count, name) {
  const koreanName = koreanIngredientNames[name] || name;
  if (count === 1) return koreanName;
  return koreanName + " x" + count;
}

function buildKoreanOrder(order) {
  const normalOptionalParts = order.optionalEntries
    .filter((item) => item.name !== "galbi")
    .map((item) => koreanQuantityLabel(item.count, item.name));
  const sauceParts = order.sauceEntries.map((item) =>
    koreanQuantityLabel(item.count, item.name),
  );
  const galbiParts = order.optionalEntries
    .filter((item) => item.name === "galbi")
    .map((item) => koreanQuantityLabel(item.count, item.name));
  const parts = [
    koreanIngredientNames[order.rice] || order.rice,
    ...normalOptionalParts,
    ...sauceParts,
    ...galbiParts,

function renderCookOrderText(orderArray) {
  const source = Array.isArray(orderArray) ? orderArray : [];
  const counts = new Map();
  const orderedNames = [];
  source.forEach((item) => {
    if (!counts.has(item)) {
      counts.set(item, 1);
      orderedNames.push(item);
    } else {
      counts.set(item, counts.get(item) + 1);
    }
  });
  const displayNames = orderedNames.filter((item) => item !== "galbi");
  if (counts.has("galbi")) {
    displayNames.push("galbi");
  }
  const lines = displayNames.map((item) => {
    const count = counts.get(item);
    return count > 1 ? `${item} x ${count}` : item;
  });
  cookOrderText.textContent = lines.join("\n");
}

function formatTime(seconds) {
  const minutes = Math.floor(seconds / 60);
  const secs = seconds % 60;
  return minutes + ":" + String(secs).padStart(2, "0");

function tickTimer() {

    handleTimeOut();

function startIngredientDrag(e) {
  const target = e.target.closest(".draggable");
  if (!target) return;
  if (target.dataset.locked === "true") return;
  if (shouldBlockBeforeRice(target)) return;
  startPointer = { x: e.clientX, y: e.clientY };
  if (target.dataset.source === "true") {
    if (isRiceSource(target) && hasRiceBeenChosen()) return;
    if (isEggSource(target) && !isEggReadyToUse(target)) return;
    const pos = getPos(target);
    active = makeClone(target, pos.x, pos.y);
    startPos = getPos(active);
    if (isEggSource(target)) disableEggSource();
  } else {
    active = target;
    startPos = getPos(active);
  }
  startSpecialDragMode(active);
  active.setPointerCapture(e.pointerId);
  e.preventDefault();
}

function moveIngredientDrag(e) {
  if (!active) return;
  const stageScale = getStageScale();
  const dx = (e.clientX - startPointer.x) / stageScale;
  const dy = (e.clientY - startPointer.y) / stageScale;
  let nextX = startPos.x + dx;
  let nextY = startPos.y + dy;
  ({ x: nextX, y: nextY } = clampToStage(active, nextX, nextY));
  active.style.setProperty("--x", `${nextX}px`);
  active.style.setProperty("--y", `${nextY}px`);
}

function finishCurrentDrag(e) {
  if (!active) return;

  if (
    e.pointerId !== undefined &&
    active.hasPointerCapture(e.pointerId)
  ) {
    active.releasePointerCapture(e.pointerId);
  }

  const droppedInBowl = isInsideBowl(active);
  const shouldSnapToCenter = isCenterStageDraggable(active);
  const draggedEgg = isEggIngredient(active);

  endSpecialDragMode(active, droppedInBowl);

  if (shouldSnapToCenter && droppedInBowl) {
    disableRiceSources();
    snapToStageCenter(active);
    lockRiceClone(active);
  } else if (!droppedInBowl) {
    if (draggedEgg) {
      restoreEggSourceAfterFailedDrag();
    }
    active.remove();
  }

  active = null;
}
function getPos(el) {
  const style = getComputedStyle(el);
  const x = parseFloat(style.getPropertyValue("--x")) || 0;
  const y = parseFloat(style.getPropertyValue("--y")) || 0;
  return { x, y };
}

function isInsideBowl(el) {
  const bowlRect = bowl.getBoundingClientRect();
  const elRect = el.getBoundingClientRect();
  const cx = elRect.left + elRect.width / 2;
  const cy = elRect.top + elRect.height / 2;
  return (
    cx >= bowlRect.left &&
    cx <= bowlRect.right &&
    cy >= bowlRect.top &&
    cy <= bowlRect.bottom
  );
}

function clampToStage(el, x, y) {
  const localScale = getElementLocalScale(el);
  const maxX = stage.clientWidth - el.offsetWidth * localScale;
  const maxY = stage.clientHeight - el.offsetHeight * localScale;
  return {
    x: Math.min(Math.max(0, x), Math.max(0, maxX)),
    y: Math.min(Math.max(0, y), Math.max(0, maxY)),
  };
}

function makeClone(source, x, y) {
  const clone = source.cloneNode(true);
  clone.dataset.source = "false";
  clone.dataset.originalSrc = source.dataset.originalSrc;
  clone.style.opacity = "1";
  clone.style.setProperty("--x", `${x}px`);
  clone.style.setProperty("--y", `${y}px`);
  clone.style.setProperty("--scale", "1");
  stage.appendChild(clone);
  return clone;
}

function getDragSwapTarget(el) {
  const original = el.dataset.originalSrc;
  const swapMap = {
    "PR.gj.png": {
      dragSrc: "PR.spoon.png",
      finalSrc: "PR.gj.png",
    },
    "PR.sesameoil.png": {
      dragSrc: "PR.sesameOilSpoon.png",
      finalSrc: "PR.sesameoil.png",
    },
  };
  return swapMap[original] || null;
}

function startSpecialDragMode(el) {
  const target = getDragSwapTarget(el);
  if (!target) return;
  document.body.classList.add("hide-cursor");
  el.setAttribute("src", target.dragSrc);
}

function endSpecialDragMode(el, droppedInBowl) {
  const target = getDragSwapTarget(el);
  if (!target) return;
  document.body.classList.remove("hide-cursor");
  if (droppedInBowl) {
    el.setAttribute("src", target.finalSrc);
  }
}

function isRiceSource(el) {
  const original = el.dataset.originalSrc;
  return (
    original === "PR.whiterice.png" || original === "PR.brownrice.png"
  );
}

function hasRiceBeenChosen() {
  return stage.dataset.riceChosen === "true";
}

function disableRiceSources() {
  stage.dataset.riceChosen = "true";
  stage
    .querySelectorAll('.draggable[data-source="true"]')
    .forEach((el) => {
      if (isRiceSource(el)) {
        el.dataset.used = "true";
        el.style.pointerEvents = "none";
        el.style.display = "none";
      }
    });
}

function shouldBlockBeforeRice(el) {
  return (
    el.dataset.source === "true" &&
    !isRiceSource(el) &&
    !hasRiceBeenChosen()
  );
}

function isEggSource(el) {
  return el.id === "eggSource";
}

function isEggReadyToUse(el) {
  return (
    isEggSource(el) &&
    el.dataset.cooked === "true" &&
    el.dataset.used !== "true"
  );
}

function disableEggSource() {
  eggSource.dataset.used = "true";
  eggSource.style.pointerEvents = "none";
  eggSource.style.display = "none";
}

function restoreEggSourceAfterFailedDrag() {
  eggSource.style.opacity = "1";
  eggSource.style.display = "";
  eggSource.style.pointerEvents = "";
  eggSource.dataset.cooked = "true";
  eggSource.dataset.used = "false";
}

function isEggIngredient(el) {
  return el && el.dataset.originalSrc === "PR.egg.png";
}

function lockRiceClone(el) {
  el.dataset.locked = "true";
  el.style.pointerEvents = "none";
  el.style.cursor = "default";
}

function isCenterStageDraggable(el) {
  const original = el.dataset.originalSrc;
  return (
    original === "PR.whiterice.png" || original === "PR.brownrice.png"
  );
}

function snapToStageCenter(el) {
  const centerX = 555;
  const centerY = 300;
  const finalScale = 1.8;
  el.style.setProperty("--x", `${centerX}px`);
  el.style.setProperty("--y", `${centerY}px`);
  el.style.setProperty("--scale", `${finalScale}`);
  el.animate(
    [
      { transform: `translate(${centerX}px, ${centerY}px) scale(1)` },
      { transform: `translate(${centerX}px, ${centerY}px) scale(2.1)` },
      {
        transform: `translate(${centerX}px, ${centerY}px) scale(${finalScale})`,
      },
    ],
    {
      duration: 100,
      easing: "ease-out",
      fill: "forwards",
    },
  );
}

function eggClamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function eggSmoothstep(t) {
  t = eggClamp(t, 0, 1);
  return t * t * (3 - 2 * t);
}

function eggLerp(a, b, t) {
  return a + (b - a) * t;
}

function isEggClicked(mx, my) {
  const dx = mx - eggData.x;
  const dy = my - eggData.y;
  return (
    (dx * dx) / (eggData.rx * eggData.rx) +
      (dy * dy) / (eggData.ry * eggData.ry) <=
    1
  );
}

function resetEggGame() {
  eggState = "idle";
  eggProgress = 0;
  updateEggButtons();
  updateCookingSound();
}

function remakeEgg() {
  eggState = "idle";
  eggProgress = 0;
  updateEggButtons();
  updateCookingSound();
}

function serveEgg() {
  if (eggState !== "result") return;
  const servedProgress = eggProgress;
  const cookPercent = Math.round(servedProgress * 100);
  let cookState = "undercooked";
  if (
    servedProgress >= eggPerfectStart &&
    servedProgress <= eggPerfectEnd
  ) {
    cookState = "perfect";
  } else if (servedProgress > eggPerfectEnd && servedProgress <= 0.9) {
    cookState = "overcooked";
  } else if (servedProgress > 0.9) {
    cookState = "burnt";
  }
  const servedEggData = {
    cookingProgress: Number(servedProgress.toFixed(3)),
    cookingPercent: cookPercent + "%",
    cookingState: cookState,
  };
  localStorage.setItem("servedEgg", JSON.stringify(servedEggData));
  console.log("Last served egg:", servedEggData);
  updateCookEggSource(servedEggData);
  eggState = "idle";
  eggProgress = 0;
  updateEggButtons();
  updateCookingSound();
}

function completeEgg() {
  if (eggState !== "cook") return;
  eggState = "result";
  updateEggButtons();
  updateCookingSound();
}

function eggShapePath(x, y, scale = 1) {
  eggCtx.beginPath();
  eggCtx.moveTo(x, y - 36 * scale);
  eggCtx.bezierCurveTo(
    x - 19 * scale,
    y - 33 * scale,
    x - 30 * scale,
    y - 8 * scale,
    x - 26 * scale,
    y + 14 * scale,
  );
  eggCtx.bezierCurveTo(
    x - 22 * scale,
    y + 42 * scale,
    x + 22 * scale,
    y + 42 * scale,
    x + 26 * scale,
    y + 14 * scale,
  );
  eggCtx.bezierCurveTo(
    x + 30 * scale,
    y - 8 * scale,
    x + 19 * scale,
    y - 33 * scale,
    x,
    y - 36 * scale,
  );
  eggCtx.closePath();
}

  const whiteRy = 29;
  const yolkR = 16;
  let whiteColor = "#fffefb";
  let edgeColor = "#eee7dc";
  let yolkColor = "#ffd36a";
  if (p >= eggPerfectStart) {
    whiteColor = "#fff8e5";
    edgeColor = "#d6b56d";
    yolkColor = "#f4a000";
  }
  if (p > 0.75) {
    whiteColor = "#f4d18a";
    edgeColor = "#b77b2a";
    yolkColor = "#d98a00";
  }
  if (p > 0.9) {
    whiteColor = "#7a4b24";
    edgeColor = "#3a2414";
    yolkColor = "#6b3b16";
  }
  eggCtx.beginPath();
  eggCtx.moveTo(cx, cy - whiteRy);
  eggCtx.bezierCurveTo(
    cx - whiteRx * 0.45,
    cy - whiteRy * 1.03,
    cx - whiteRx * 1.0,
    cy - whiteRy * 0.45,
    cx - whiteRx,
    cy,
  );
  eggCtx.bezierCurveTo(
    cx - whiteRx * 1.0,
    cy + whiteRy * 0.45,
    cx - whiteRx * 0.45,
    cy + whiteRy * 0.95,
    cx,
    cy + whiteRy,
  );
  eggCtx.bezierCurveTo(
    cx + whiteRx * 0.45,
    cy + whiteRy * 0.95,
    cx + whiteRx * 1.0,
    cy + whiteRy * 0.45,
    cx + whiteRx,
    cy,
  );
  eggCtx.bezierCurveTo(
    cx + whiteRx * 1.0,
    cy - whiteRy * 0.45,
    cx + whiteRx * 0.45,
    cy - whiteRy * 1.03,
    cx,
    cy - whiteRy,
  );
  eggCtx.closePath();
  eggCtx.fillStyle = whiteColor;
  eggCtx.fill();
  eggCtx.lineWidth = 1.5;
  eggCtx.strokeStyle = edgeColor;
  eggCtx.stroke();
  eggCtx.beginPath();
  eggCtx.arc(cx, cy, yolkR, 0, Math.PI * 2);
  eggCtx.fillStyle = yolkColor;
  eggCtx.fill();
  eggCtx.beginPath();
  eggCtx.arc(cx - 4, cy - 4, yolkR * 0.28, 0, Math.PI * 2);
  eggCtx.fillStyle = "rgba(255,255,255,0.35)";
  eggCtx.fill();
  if (p > 0.82) {
    eggCtx.fillStyle = "rgba(60,30,10,0.45)";
    for (let i = 0; i < 5; i++) {
      const bx = cx - 30 + i * 14 + Math.sin(eggTick * 0.05 + i) * 2;
      const by = cy - 7 + Math.cos(i) * 16;
      eggCtx.beginPath();
      eggCtx.ellipse(bx, by, 4, 2.5, i, 0, Math.PI * 2);
      eggCtx.fill();
    }
  }
}

function drawNaturalBreakingEgg(p) {
  const crackAmount = eggSmoothstep(p / 0.25);
  const openAmount = eggSmoothstep((p - 0.18) / 0.35);
  const pourAmount = eggSmoothstep((p - 0.35) / 0.45);
  const yolkAmount = eggSmoothstep((p - 0.52) / 0.38);
  const panEggAmount = eggSmoothstep((p - 0.88) / 0.1);
  if (panEggAmount > 0) {
    drawFriedEgg(panEggAmount * 0.9);
  }
  if (openAmount < 0.08) {
    const shake = Math.sin(eggTick * 0.7) * 0.035 * crackAmount;
    drawWholeEgg(shake);
    eggCtx.save();
    eggShapePath(eggData.x, eggData.y, 1);
    eggCtx.clip();
    drawEggCrackLines(eggData.x, eggData.y, crackAmount);
    eggCtx.restore();
    return;
  }
  if (pourAmount > 0.02 && pourAmount < 0.98) {
    drawEggWhiteStream(pourAmount);
  }
  if (yolkAmount > 0.02 && yolkAmount < 0.96) {
    drawEggFallingYolk(yolkAmount);
  }
  const shellGap = 8 + openAmount * 38;
  const shellLift = openAmount * 7;
  const wobble = Math.sin(eggTick * 0.25) * 0.04;
  drawEggShellHalf(
    -1,
    eggData.x - shellGap,
    eggData.y + 4 - shellLift,
    -0.45 - openAmount * 0.75 + wobble,
  );
  drawEggShellHalf(
    1,
    eggData.x + shellGap,
    eggData.y + 4 - shellLift,
    0.45 + openAmount * 0.75 - wobble,
  );
  if (openAmount > 0.45) {
    eggCtx.fillStyle = "#fffaf0";
    eggCtx.beginPath();
    eggCtx.arc(eggData.x - 25, eggData.y + 55, 3, 0, Math.PI * 2);
    eggCtx.fill();
    eggCtx.beginPath();
    eggCtx.arc(eggData.x + 28, eggData.y + 52, 2.5, 0, Math.PI * 2);
    eggCtx.fill();
  }
}

function drawEggStartText() {

function drawEggCookUI() {

  const barX = 100;

function updateEggGame() {
  eggTick++;
  if (eggState === "break") {
    eggProgress += 0.018;
    if (eggProgress >= 1) {
      eggProgress = 0;
      eggState = "cook";
      updateCookingSound();
    }
  } else if (eggState === "cook") {
    eggProgress += 0.0065;
    if (eggProgress >= 1) {
      eggProgress = 1;
    }
  }
  updateEggButtons();
}

function drawEggGame() {
  drawEggBackground();
  drawEggFire();
  drawEggPan();
  if (eggState === "idle") {
    drawWholeEgg();
    drawEggStartText();
  }
  if (eggState === "break") {
    drawNaturalBreakingEgg(eggProgress);
  }
  if (eggState === "cook" || eggState === "result") {
    drawFriedEgg(eggProgress);
  }
  drawEggCookUI();
}

function eggLoop() {
  updateEggGame();
  drawEggGame();
  requestAnimationFrame(eggLoop);
}

function galbiClamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function galbiSmoothstep(t) {
  t = galbiClamp(t, 0, 1);
  return t * t * (3 - 2 * t);
}

function galbiLerp(a, b, t) {
  return a + (b - a) * t;
}

function isGalbiClicked(mx, my) {
  const left = rawGalbi.x - rawGalbi.w / 2;
  const top = rawGalbi.y - rawGalbi.h / 2;
  return (
    mx >= left &&
    mx <= left + rawGalbi.w &&
    my >= top &&
    my <= top + rawGalbi.h
  );
}

function resetGalbiGame() {
  galbiState = "idle";
  galbiProgress = 0;
  updateGalbiButtons();
  updateCookingSound();
}

function remakeGalbi() {
  galbiState = "idle";
  galbiProgress = 0;
  updateGalbiButtons();
  updateCookingSound();
}

function completeGalbi() {
  if (galbiState !== "cook") return;
  galbiState = "result";
  updateGalbiButtons();
  updateCookingSound();
}

function serveGalbi() {
  if (galbiState !== "result") return;
  const servedProgress = galbiProgress;
  const cookPercent = Math.round(servedProgress * 100);
  let cookState = "undercooked";
  if (
    servedProgress >= galbiPerfectStart &&
    servedProgress <= galbiPerfectEnd
  ) {
    cookState = "perfect";
  } else if (servedProgress > galbiPerfectEnd && servedProgress <= 0.9) {
    cookState = "overcooked";
  } else if (servedProgress > 0.9) {
    cookState = "burnt";
  }
  const servedGalbiData = {
    cookingProgress: Number(servedProgress.toFixed(3)),
    cookingPercent: cookPercent + "%",
    cookingState: cookState,
  };
  localStorage.setItem("servedGalbi", JSON.stringify(servedGalbiData));
  console.log("Last served galbi:", servedGalbiData);
  galbiState = "idle";
  galbiProgress = 0;
  updateGalbiButtons();
  updateCookingSound();
}

function updateGalbiButtons() {
  galbiRemakeBtn.disabled = !(
    galbiState === "cook" || galbiState === "result"
  );
  galbiServeBtn.disabled = !(galbiState === "result");
  galbiCompleteBtn.disabled = !(galbiState === "cook");
}

function getGalbiColors(p) {
  let meatBase = "#bd5434";
  let meatShadow = "#81301c";
  let outline = "#4f160b";
  let boneOuter = "#f2d49c";
  let boneInner = "#74401f";
  let fat = "rgba(255, 218, 162, 0.78)";
  let glaze = "rgba(255,255,255,0.26)";
  let char = "rgba(92, 32, 12, 0.42)";
  if (p >= galbiPerfectStart) {
    meatBase = "#9c4325";
    meatShadow = "#682716";
    outline = "#451008";
    boneOuter = "#ebc98d";
    boneInner = "#66351a";
    fat = "rgba(235, 185, 120, 0.72)";
    char = "rgba(70, 20, 8, 0.55)";
  }
  if (p > 0.78) {
    meatBase = "#743118";
    meatShadow = "#4c1c0e";
    outline = "#331008";
    boneOuter = "#d7ad76";
    boneInner = "#552a15";
    fat = "rgba(205, 145, 82, 0.60)";
    glaze = "rgba(255,255,255,0.14)";
    char = "rgba(40, 14, 6, 0.65)";
  }
  if (p > 0.9) {
    meatBase = "#32150f";
    meatShadow = "#21100b";
    outline = "#140806";
    boneOuter = "#9f7a54";
    boneInner = "#3d2115";
    fat = "rgba(125, 84, 55, 0.50)";
    glaze = "rgba(255,255,255,0.07)";
    char = "rgba(0, 0, 0, 0.72)";
  }
  return {
    meatBase,
    meatShadow,
    outline,
    boneOuter,
    boneInner,
    fat,
    glaze,
    char,
  };
}

function galbiBlobPath(ctx, x, y, w, h) {
  ctx.beginPath();
  ctx.moveTo(x - w * 0.46, y - h * 0.18);
  ctx.bezierCurveTo(
    x - w * 0.42,
    y - h * 0.44,
    x - w * 0.2,
    y - h * 0.52,
    x + w * 0.06,
    y - h * 0.47,
  );
  ctx.bezierCurveTo(
    x + w * 0.33,
    y - h * 0.43,
    x + w * 0.5,
    y - h * 0.22,
    x + w * 0.48,
    y + h * 0.03,
  );
  ctx.bezierCurveTo(
    x + w * 0.47,
    y + h * 0.29,
    x + w * 0.27,
    y + h * 0.47,
    x - w * 0.02,
    y + h * 0.49,
  );
  ctx.bezierCurveTo(
    x - w * 0.28,
    y + h * 0.5,
    x - w * 0.49,
    y + h * 0.32,
    x - w * 0.51,
    y + h * 0.07,
  );
  ctx.bezierCurveTo(
    x - w * 0.52,
    y - h * 0.04,
    x - w * 0.51,
    y - h * 0.12,
    x - w * 0.46,
    y - h * 0.18,
  );
  ctx.closePath();
}

function drawGalbi(ctx, x, y, w, h, p, rotation = 0) {
  const c = getGalbiColors(p);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation);
  ctx.translate(-x, -y);
  ctx.shadowColor = "rgba(0,0,0,0.18)";
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 4;
  galbiBlobPath(ctx, x, y, w, h);
  ctx.fillStyle = c.meatBase;
  ctx.fill();
  ctx.lineWidth = Math.max(4, w * 0.022);
  ctx.strokeStyle = c.outline;
  ctx.stroke();
  ctx.save();
  galbiBlobPath(ctx, x, y, w, h);
  ctx.clip();
  const grad = ctx.createRadialGradient(
    x - w * 0.1,
    y - h * 0.12,
    w * 0.05,
    x,
    y,
    w * 0.62,
  );
  grad.addColorStop(0, c.meatBase);
  grad.addColorStop(1, c.meatShadow);
  ctx.fillStyle = grad;
  ctx.fillRect(x - w * 0.6, y - h * 0.65, w * 1.2, h * 1.3);
  const bones = [
    [-0.22, -0.08, 0.095, 0.105, -0.12],
    [0.03, -0.13, 0.105, 0.11, 0.08],
    [0.27, -0.04, 0.09, 0.1, 0.16],
  ];
  bones.forEach(([bx, by, brx, bry, ang]) => {
    ctx.save();
    ctx.translate(x + w * bx, y + h * by);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.ellipse(0, 0, w * brx, h * bry, 0, 0, Math.PI * 2);
    ctx.fillStyle = c.boneOuter;
    ctx.fill();
    ctx.lineWidth = Math.max(2.5, w * 0.014);
    ctx.strokeStyle = c.outline;
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(0, 0, w * brx * 0.48, h * bry * 0.44, 0, 0, Math.PI * 2);
    ctx.fillStyle = c.boneInner;
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(
      -w * brx * 0.22,
      -h * bry * 0.18,
      w * brx * 0.16,
      h * bry * 0.12,
      -0.3,
      0,
      Math.PI * 2,
    );
    ctx.fillStyle = "rgba(255, 245, 210, 0.30)";
    ctx.fill();
    ctx.restore();
  });
  ctx.strokeStyle = c.fat;
  ctx.lineWidth = Math.max(3, w * 0.018);
  ctx.lineCap = "round";
  const marbling = [
    [-0.38, 0.06, -0.24, -0.01, -0.11, 0.07],
    [-0.16, 0.2, -0.03, 0.1, 0.13, 0.18],
    [0.08, 0.08, 0.22, 0.0, 0.38, 0.06],
    [-0.3, -0.27, -0.12, -0.2, 0.05, -0.25],
    [0.16, -0.28, 0.29, -0.2, 0.41, -0.11],
  ];
  marbling.forEach(([x1, y1, x2, y2, x3, y3]) => {
    ctx.beginPath();
    ctx.moveTo(x + w * x1, y + h * y1);
    ctx.bezierCurveTo(
      x + w * x2,
      y + h * y2,
      x + w * x2,
      y + h * y2,
      x + w * x3,
      y + h * y3,
    );
    ctx.stroke();
  });
  ctx.fillStyle = c.glaze;
  const highlights = [
    [-0.3, -0.18, 0.11, 0.045, -0.55],
    [-0.06, 0.02, 0.09, 0.038, -0.35],
    [0.21, -0.18, 0.1, 0.04, -0.4],
    [0.26, 0.21, 0.08, 0.036, -0.2],
  ];
  highlights.forEach(([hx, hy, hrx, hry, ang]) => {
    ctx.beginPath();
    ctx.ellipse(
      x + w * hx,
      y + h * hy,
      w * hrx,
      h * hry,
      ang,
      0,
      Math.PI * 2,
    );
    ctx.fill();
  });
  for (let i = 0; i < 22; i++) {
    const row = i % 7;
    const col = Math.floor(i / 7);
    const px = x - w * 0.35 + row * w * 0.11 + (col % 2) * 4;
    const py = y - h * 0.18 + col * h * 0.15 + Math.sin(i * 1.7) * 4;
    ctx.beginPath();
    ctx.ellipse(px, py, w * 0.022, h * 0.026, i * 0.4, 0, Math.PI * 2);
    ctx.fillStyle = i % 2 === 0 ? "rgba(210,105,65,0.30)" : c.char;
    ctx.fill();
  }
  if (p > 0.34) {
    ctx.strokeStyle = p > 0.9 ? "rgba(0,0,0,0.82)" : c.char;
    ctx.lineWidth = Math.max(5, w * 0.018);
    ctx.lineCap = "round";
    for (let i = 0; i < 5; i++) {
      const gx = x - w * 0.28 + i * w * 0.14;
      ctx.beginPath();
      ctx.moveTo(gx, y - h * 0.24);
      ctx.lineTo(gx + w * 0.07, y + h * 0.28);
      ctx.stroke();
    }
  }
  ctx.restore();
  ctx.restore();
}

function drawMovingGalbi(p) {

  const x = galbiLerp(rawGalbi.x, grillGalbi.x, t);
  const y = galbiLerp(rawGalbi.y, grillGalbi.y, t);
  const w = galbiLerp(rawGalbi.w, grillGalbi.w, t);
  const h = galbiLerp(rawGalbi.h, grillGalbi.h, t);
  const r = galbiLerp(-0.05, 0.03, t);
  drawGalbi(galbiCtx, x, y, w, h, 0.08, r);
}

  updateGalbiButtons();
}

function drawGalbiGame() {
  drawGalbiBackground();
  drawGalbiGrill();
  drawGalbiFire();
  drawGalbiPlate();
  if (galbiState === "idle") {
    drawRawGalbiOnPlate();
  }
  if (galbiState === "place") {
    drawMovingGalbi(galbiProgress);
  }
  if (galbiState === "cook" || galbiState === "result") {
    drawGalbi(
      galbiCtx,
      grillGalbi.x,
      grillGalbi.y,
      grillGalbi.w,
      grillGalbi.h,
      galbiProgress,
      0.03,
    );
    drawGalbiSmoke(galbiProgress);
  }
  drawGalbiCookUI();
}

function galbiLoop() {
  updateGalbiGame();
  drawGalbiGame();
  requestAnimationFrame(galbiLoop);
}

/* =========================
9. 완성버튼(점수매기고 결과나옴)
========================= */

function finishOrderAndShowResult() {
  stopTimer();
  const bowlItems = [...stage.querySelectorAll('.draggable[data-source="false"]')].filter((el) => isInsideBowl(el));
  const savedIngredients = bowlItems.map((el) =>
    el.dataset.ingredientName || srcToIngredientName(el.dataset.originalSrc || el.getAttribute("src")),
  );
  const servedGalbiData = getServedGalbiData();
  if (currentOrderIngredients.includes("galbi") && servedGalbiData) {
    savedIngredients.push("galbi");
  }
  const matchPercent = calculateMatchPercent(currentOrderIngredients, savedIngredients);
  const resultBreakdown = buildCookResultBreakdown(matchPercent, bowlItems);
  console.log("Saved bowl:", savedIngredients);
  console.log("Match percent:", matchPercent + "%");
  console.log("Result breakdown:", resultBreakdown);
  console.log("Time left:", timeLeft + "s");
  pendingCookResult = {
    bowlItems,
    savedIngredients,
    matchPercent,
    tipAmount: resultBreakdown.totalTip,
  };
  applyTipAmount(resultBreakdown.totalTip);
  active = null;
  document.body.classList.remove("hide-cursor");
  showCookResultOverlay(resultBreakdown);
}

function calculateMatchPercent(orderArray, bowlArray) {
  if (!orderArray.length) return 0;
  const orderCounts = new Map();
  const bowlCounts = new Map();
  orderArray.forEach((item) => {
    orderCounts.set(item, (orderCounts.get(item) || 0) + 1);
  });
  bowlArray.forEach((item) => {
    bowlCounts.set(item, (bowlCounts.get(item) || 0) + 1);
  });
  let matchedCount = 0;
  orderCounts.forEach((orderCount, item) => {
    const bowlCount = bowlCounts.get(item) || 0;
    matchedCount += Math.min(orderCount, bowlCount);
  });
  return Math.round((matchedCount / orderArray.length) * 100);
}

function getAccuracyTipAmount(matchPercent) {
  if (matchPercent === 100) {
    return 5;
  } else if (matchPercent >= 90) {
    return 3.5;
  } else if (matchPercent >= 80) {
    return 1.5;
  } else if (matchPercent >= 55) {
    return 0;
  }
  return -3;
}

function getSpeedTipAmount(secondsLeft) {
  if (secondsLeft >= 40) {
    return 1;
  } else if (secondsLeft >= 20) {
    return 0.5;
  }
  return 0;
}

function getEggCookingStateFromBowl(orderArray, bowlItems) {
  if (!orderArray.includes("fried egg")) {
    return "not ordered";
  }
  const eggItem = bowlItems.find(
    (el) =>
      (el.dataset.ingredientName ||
        srcToIngredientName(
          el.dataset.originalSrc || el.getAttribute("src"),
        )) === "fried egg",
  );
  if (!eggItem) {
    return "missing";
  }
  return eggItem.dataset.cookingState || "unknown";
}

function getEggCookingTipAmount(eggCookingState) {
  const eggTipMap = {
    "not ordered": 0,
    missing: 0,
    perfect: 2,
    overcooked: 0,
    undercooked: 0,
    burnt: -1,
    unknown: 0,
  };
  return eggTipMap[eggCookingState] || 0;
}

function getServedGalbiData() {
  const saved = localStorage.getItem("servedGalbi");
  if (!saved) return null;
  try {
    return JSON.parse(saved);
  } catch (error) {
    return null;
  }
}

function getGalbiCookingStateFromServed(orderArray) {
  if (!orderArray.includes("galbi")) {
    return "not ordered";
  }
  const servedGalbiData = getServedGalbiData();
  if (!servedGalbiData) {
    return "missing";
  }
  return servedGalbiData.cookingState || "unknown";
}

function getGalbiCookingTipAmount(galbiCookingState) {
  const galbiTipMap = {
    "not ordered": 0,
    missing: 0,
    perfect: 2,
    overcooked: 0,
    undercooked: 0,
    burnt: -1,
    unknown: 0,
  };
  return galbiTipMap[galbiCookingState] || 0;
}

function formatTipNumber(amount) {
  return String(Math.round(amount));
}

function formatTipAmount(amount) {
  if (amount > 0) {
    return "+$" + formatTipNumber(amount);
  } else if (amount < 0) {
    return "-$" + formatTipNumber(Math.abs(amount));
  }
  return "$0";
}

function buildCookResultBreakdown(matchPercent, bowlItems) {
  const eggCookingState = getEggCookingStateFromBowl(
    currentOrderIngredients,
    bowlItems,
  );
  const galbiCookingState = getGalbiCookingStateFromServed(
    currentOrderIngredients,
  );
  const accuracyTip = Math.round(getAccuracyTipAmount(matchPercent));
  const speedTip = Math.round(getSpeedTipAmount(timeLeft));
  const eggTip = Math.round(getEggCookingTipAmount(eggCookingState));
  const galbiTip = Math.round(
    getGalbiCookingTipAmount(galbiCookingState),
  );
  const totalTip = accuracyTip + speedTip + eggTip + galbiTip;
  return {
    matchPercent,
    timeLeft,
    eggCookingState,
    galbiCookingState,
    accuracyTip,
    speedTip,
    eggTip,
    galbiTip,
    totalTip,
  };
}

function applyTipAmount(tipAmount) {
  totalTips += tipAmount;
  updateTipDisplay();
  console.log("Tip earned:", "$" + tipAmount);
  console.log("Total tips:", "$" + totalTips);
  return tipAmount;
}

function showCookResultOverlay(result) {
  resultAccuracyDetail.textContent = result.matchPercent + "% matched";
  resultAccuracyTip.textContent = formatTipAmount(result.accuracyTip);
  resultSpeedDetail.textContent = formatTime(result.timeLeft) + " left";
  resultSpeedTip.textContent = formatTipAmount(result.speedTip);
  resultEggDetail.textContent = result.eggCookingState;
  resultEggTip.textContent = formatTipAmount(result.eggTip);
  resultGalbiDetail.textContent = result.galbiCookingState;
  resultGalbiTip.textContent = formatTipAmount(result.galbiTip);
  resultTotalTip.textContent = formatTipAmount(result.totalTip);
  cookResultOverlay.style.display = "flex";
}

function hideCookResultOverlay() {
  cookResultOverlay.style.display = "none";
}

function formatTotalTipAmount(amount) {
  const roundedAmount = Math.round(amount);
  if (roundedAmount < 0) {
    return "-$" + Math.abs(roundedAmount);
  }
  return "$" + roundedAmount;
}

function updateTipDisplay() {
  tipTotalText.textContent = formatTotalTipAmount(totalTips);
}

/* =========================
10. next버튼 (손님 화면으로 돌아가고 말나옴)
========================= */

function finishCookResultToCustomer() {
  if (!pendingCookResult) return;
  pendingCookResult.bowlItems.forEach((el) => el.remove());
  hideCookResultOverlay();
  showCustomerScreenFromCook();
  typeCustomerText(
    getCustomerMessageFromTipAmount(pendingCookResult.tipAmount),
  );
  showResultScreen();
  playCustomerFloatingImages(pendingCookResult.tipAmount);
  pendingCookResult = null;
}

function showCustomerScreenFromCook() {
  updateResponsiveLayout();
  pauseCookingSound();
  mainScreen.style.display = "none";
  cookScreen.style.display = "none";
  eggScreen.style.display = "none";
  pauseScreen.style.display = "none";
  customerScreen.style.display = "flex";
  document.title = "customer";
  pauseMainBGM();
  setCustomerTextInstant("");
  showTipsBox();
}

function showResultScreen() {
  cookBtn.style.display = "none";
  nextCustomerBtn.style.display = "inline-block";
}

function getEnglishCustomerMessageFromTipAmount(tipAmount) {
  if (tipAmount >= 7) {
    return "WOW!! This is amazing!!";
  } else if (tipAmount >= 5) {
    return "This is really great!";
  } else if (tipAmount >= 3) {
    return "Thank you! I liked it.";
  } else if (tipAmount > 0) {
    return "Thanks.";
  } else if (tipAmount === 0) {
    return "Okay.";
  }
  return "I don't like this...";
}

function getKoreanCustomerMessageFromTipAmount(tipAmount) {
  if (tipAmount >= 7) {
    return "와!! 개존맛이네요!!";
  } else if (tipAmount >= 5) {
    return "또올게요 감사해요!";
  } else if (tipAmount >= 3) {
    return "감사합니다! 맛있었어요.";
  } else if (tipAmount > 0) {
    return "감사합니다.";
  } else if (tipAmount === 0) {
    return "안녕히 계세요.";
  }
  return "...쩝..";
}

function getCustomerMessageFromTipAmount(tipAmount) {
  if (currentCustomerImageNumber === 7) {
    return getKoreanCustomerMessageFromTipAmount(tipAmount);
  }
  return getEnglishCustomerMessageFromTipAmount(tipAmount);
}

function playCustomerFloatingImages(tipAmount) {
  const scene = document.querySelector("#customerScreen .scene");
  const positions = [
    { left: 1280, top: 300 },
    { left: 1110, top: 210 },
    { left: 940, top: 300 },
  ];
  positions.forEach((pos, index) => {
    const img = document.createElement("img");
    if (tipAmount > 0) {
      img.src = "PR.money.jpg";
    } else if (tipAmount < 0) {
      img.src = "PR.rage.png";
    } else {
      return;
    }
    img.className = "floating-reward";
    img.style.left = pos.left + "px";
    img.style.top = pos.top + "px";
    img.style.animationDelay = index * 0.15 + "s";
    scene.appendChild(img);
    img.addEventListener("animationend", () => {
      img.remove();
    });
  });
}

/* =========================
11. 일시정지버튼
========================= */

function showPauseScreen() {
  pauseCookingSound();
  mainScreen.style.display = "none";
  customerScreen.style.display = "none";
  cookScreen.style.display = "none";
  eggScreen.style.display = "none";
  pauseScreen.style.display = "flex";
  document.title = "Paused";
  pauseMainBGM();
  hideTipsBox();
  active = null;
  document.body.classList.remove("hide-cursor");
}

function resumeCookScreen() {
  updateResponsiveLayout();
  pauseCookingSound();
  mainScreen.style.display = "none";
  customerScreen.style.display = "none";
  eggScreen.style.display = "none";
  pauseScreen.style.display = "none";
  cookScreen.style.display = "block";
  document.title = "Drag Image";
  pauseMainBGM();
  hideTipsBox();
}

function resetGameExceptTips() {
  stopTimer();
  currentOrderIngredients = [];
  setCustomerTextInstant("");
  cookOrderText.textContent = "";
  active = null;
  document.body.classList.remove("hide-cursor");
  timeLeft = TOTAL_TIME;
  updateTimerDisplay();
  stage.dataset.riceChosen = "false";
  stage
    .querySelectorAll('.draggable[data-source="false"]')
    .forEach((el) => {
      el.remove();
    });
  stage
    .querySelectorAll('.draggable[data-source="true"]')
    .forEach((el) => {
      el.dataset.used = "false";
      el.style.pointerEvents = "";
      el.style.display = "";
      if (el.dataset.originalSrc) {
        el.setAttribute("src", el.dataset.originalSrc);
      }
    });
  resetCookEggSource();
  resetEggGame();
  resetGalbiGame();
  hideCookResultOverlay();
  pendingCookResult = null;
  localStorage.removeItem("servedEgg");
  localStorage.removeItem("servedGalbi");
  nextCustomerBtn.style.display = "none";
  cookBtn.style.display = "inline-block";
}

function showTimeFailMessage() {
  const timePenalty = -3;
  totalTips += timePenalty;
  updateTipDisplay();
  typeCustomerText("Too slow... ");
  console.log("Time failed:", "$" + timePenalty);
  console.log("Total tips:", "$" + totalTips);
}

/* =========================
12. 버튼들 연결, 게임실행
========================= */

function playButtonSoundWhenButtonIsClicked(e) {
  const clickedButton = e.target.closest("button");
  if (!clickedButton || clickedButton.disabled) return;
  playButtonSound();
}

function bindGameEvents() {
  document.addEventListener("click", playButtonSoundWhenButtonIsClicked);
  window.addEventListener("load", playMainBGM);
  document.addEventListener("pointerdown", tryStartMainBGMAfterInteraction, { once: true });
  document.addEventListener("keydown", tryStartMainBGMAfterInteraction, { once: true });
  window.addEventListener("resize", () => {
    updateResponsiveLayout();
    keepFloatingBowlsInsideWindow();
  });

  // 1) 메인화면 -> 손님 주문화면
  playBtn.addEventListener("click", startGameFromMain);

  // 2) 손님 주문화면 -> 조리화면
  cookBtn.addEventListener("click", startCookFromCustomer);
  nextCustomerBtn.addEventListener("click", showNewCustomerOrder);

  // 3) 조리화면 -> 갈비계란게임 -> 다시 조리화면
  toEggBtn.addEventListener("click", showEggScreen);
  backToCookBtn.addEventListener("click", showCookScreen);

  // 4) 일시정지, 나가기
  pauseBtn.addEventListener("click", () => {
    pauseTimer();
    showPauseScreen();
  });
  resumeBtn.addEventListener("click", () => {
    resumeCookScreen();
    resumeTimer();
  });
  exitBtn.addEventListener("click", () => {
    resetGameExceptTips();
    showMainScreen();
  });

  // 5) 조리화면 재료 드레그
  stage.addEventListener("pointerdown", startIngredientDrag);
  stage.addEventListener("pointermove", moveIngredientDrag);
  stage.addEventListener("pointerup", finishCurrentDrag);
  stage.addEventListener("pointercancel", finishCurrentDrag);

  // 6) 갈비계란 만들기 컨트롤
  eggCanvas.addEventListener("click", handleEggCanvasClick);
  eggRemakeBtn.addEventListener("click", remakeEgg);
  eggServeBtn.addEventListener("click", serveEgg);
  eggCompleteBtn.addEventListener("click", completeEgg);
  galbiCanvas.addEventListener("click", handleGalbiCanvasClick);
  galbiRemakeBtn.addEventListener("click", remakeGalbi);
  galbiServeBtn.addEventListener("click", serveGalbi);
  galbiCompleteBtn.addEventListener("click", completeGalbi);

  // 7) 결과화면 -> 손님반응
  completeBtn.addEventListener("click", finishOrderAndShowResult);
  cookResultNextBtn.addEventListener("click", finishCookResultToCustomer);
}

initializeGame();
</script>
